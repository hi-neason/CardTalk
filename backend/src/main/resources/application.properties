server.address=${CARDTALK_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.application.name=cardtalk-api
server.error.include-message=never
server.error.include-stacktrace=never
cardtalk.data-file=${CARDTALK_DATA_FILE:./data/trial-metadata.json}
cardtalk.daily-limit=${CARDTALK_DAILY_LIMIT:20}
cardtalk.llm-base-url=${CARDTALK_LLM_BASE_URL:https://api.deepseek.com}
cardtalk.llm-model=${CARDTALK_LLM_MODEL:deepseek-flash}
cardtalk.llm-api-key=${CARDTALK_LLM_API_KEY:}
cardtalk.llm-timeout-seconds=${CARDTALK_LLM_TIMEOUT_SECONDS:30}

cardtalk.xfyun-endpoint=${CARDTALK_XFYUN_ENDPOINT:}
cardtalk.xfyun-engine=${CARDTALK_XFYUN_ENGINE:super-smart}
cardtalk.xfyun-resource-id=${CARDTALK_XFYUN_RESOURCE_ID:}
cardtalk.xfyun-app-id=${CARDTALK_XFYUN_APP_ID:}
cardtalk.xfyun-api-key=${CARDTALK_XFYUN_API_KEY:}
cardtalk.xfyun-api-secret=${CARDTALK_XFYUN_API_SECRET:}
cardtalk.xfyun-vcn=${CARDTALK_XFYUN_VCN:x6_lingxiaoxuan_pro}
cardtalk.xfyun-timeout-seconds=${CARDTALK_XFYUN_TIMEOUT_SECONDS:30}

# Local development capability flags, not production purchases or user authorization.
cardtalk.profile-management-enabled=${CARDTALK_PROFILE_MANAGEMENT_ENABLED:false}
cardtalk.scenario-management-enabled=${CARDTALK_SCENARIO_MANAGEMENT_ENABLED:false}
cardtalk.custom-cards-enabled=${CARDTALK_CUSTOM_CARDS_ENABLED:true}
