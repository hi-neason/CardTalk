server.address=${CARDTALK_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.application.name=cardtalk-api
server.error.include-message=never
server.error.include-stacktrace=never
cardtalk.data-file=${CARDTALK_DATA_FILE:./data/trial-metadata.json}
cardtalk.daily-limit=${CARDTALK_DAILY_LIMIT:20}
cardtalk.llm-base-url=${CARDTALK_LLM_BASE_URL:https://api.deepseek.com}
cardtalk.llm-model=${CARDTALK_LLM_MODEL:deepseek-flash}
cardtalk.llm-api-key=${CARDTALK_LLM_API_KEY:}
cardtalk.llm-timeout-seconds=${CARDTALK_LLM_TIMEOUT_SECONDS:30}

cardtalk.xfyun-endpoint=${CARDTALK_XFYUN_ENDPOINT:}
cardtalk.xfyun-engine=${CARDTALK_XFYUN_ENGINE:super-smart}
cardtalk.xfyun-resource-id=${CARDTALK_XFYUN_RESOURCE_ID:}
cardtalk.xfyun-app-id=${CARDTALK_XFYUN_APP_ID:}
cardtalk.xfyun-api-key=${CARDTALK_XFYUN_API_KEY:}
cardtalk.xfyun-api-secret=${CARDTALK_XFYUN_API_SECRET:}
cardtalk.xfyun-vcn=${CARDTALK_XFYUN_VCN:x6_lingxiaoxuan_pro}
cardtalk.xfyun-timeout-seconds=${CARDTALK_XFYUN_TIMEOUT_SECONDS:30}

# Local development capability flags, not production purchases or user authorization.
cardtalk.profile-management-enabled=${CARDTALK_PROFILE_MANAGEMENT_ENABLED:false}
cardtalk.scenario-management-enabled=${CARDTALK_SCENARIO_MANAGEMENT_ENABLED:false}
cardtalk.custom-cards-enabled=${CARDTALK_CUSTOM_CARDS_ENABLED:true}

cardtalk.analytics-enabled=${CARDTALK_ANALYTICS_ENABLED:false}

# Family accounts use a separate single-process local store and session namespace.
cardtalk.family-data-file=${CARDTALK_FAMILY_DATA_FILE:./data/families.json}
cardtalk.family-registration-enabled=${CARDTALK_FAMILY_REGISTRATION_ENABLED:true}
cardtalk.family-session-seconds=${CARDTALK_FAMILY_SESSION_SECONDS:604800}
cardtalk.family-cookie-secure=${CARDTALK_FAMILY_COOKIE_SECURE:false}
cardtalk.family-allowed-origins=${CARDTALK_FAMILY_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

# Explicit postgres mode fails startup if connection or migrations fail; no JSON fallback.
cardtalk.family-repository-mode=${CARDTALK_FAMILY_REPOSITORY_MODE:json}
cardtalk.family-jdbc-url=${CARDTALK_FAMILY_JDBC_URL:}
cardtalk.family-jdbc-user=${CARDTALK_FAMILY_JDBC_USER:}
cardtalk.family-jdbc-password=${CARDTALK_FAMILY_JDBC_PASSWORD:}

# Immutable development objects: single process owns the local catalog and files.
cardtalk.asset-store-mode=${CARDTALK_ASSET_STORE_MODE:local}
cardtalk.asset-directory=${CARDTALK_ASSET_DIRECTORY:./data/assets}
cardtalk.asset-max-bytes=${CARDTALK_ASSET_MAX_BYTES:16777216}
cardtalk.asset-max-dimension=${CARDTALK_ASSET_MAX_DIMENSION:16384}
cardtalk.asset-max-pixels=${CARDTALK_ASSET_MAX_PIXELS:40000000}

# AI count-only report explanation. Development memory quota is separate from expansion.
cardtalk.report-daily-limit=${CARDTALK_REPORT_DAILY_LIMIT:5}
cardtalk.report-timeout-seconds=${CARDTALK_REPORT_TIMEOUT_SECONDS:30}
cardtalk.report-max-concurrent=${CARDTALK_REPORT_MAX_CONCURRENT:2}

cardtalk.cloud-enabled=${CARDTALK_CLOUD_ENABLED:false}

# Shared asset metadata is explicit and requires the same PostgreSQL family database.
cardtalk.asset-metadata-mode=${CARDTALK_ASSET_METADATA_MODE:json}
cardtalk.s3-endpoint=${CARDTALK_S3_ENDPOINT:}
cardtalk.s3-region=${CARDTALK_S3_REGION:us-east-1}
cardtalk.s3-bucket=${CARDTALK_S3_BUCKET:}
cardtalk.s3-access-key=${CARDTALK_S3_ACCESS_KEY:}
cardtalk.s3-secret-key=${CARDTALK_S3_SECRET_KEY:}
cardtalk.s3-path-style=${CARDTALK_S3_PATH_STYLE:true}
cardtalk.s3-allow-loopback-http=${CARDTALK_S3_ALLOW_LOOPBACK_HTTP:false}
cardtalk.s3-timeout-seconds=${CARDTALK_S3_TIMEOUT_SECONDS:30}

# Enforce independent family entitlements for cloud profile/scene/report writes; requires PostgreSQL.
cardtalk.billing-enforced=${CARDTALK_BILLING_ENFORCED:false}
cardtalk.billing-products-file=${CARDTALK_BILLING_PRODUCTS_FILE:}

cardtalk.billing-operator-account-ids=${CARDTALK_BILLING_OPERATOR_ACCOUNT_IDS:}

cardtalk.billing-notify-url=${CARDTALK_BILLING_NOTIFY_URL:}

# WeChat API v3 H5; disabled until merchant configuration is supplied.
cardtalk.billing-provider=${CARDTALK_BILLING_PROVIDER:none}
cardtalk.wechat-mchid=${CARDTALK_WECHAT_MCHID:}
cardtalk.wechat-appid=${CARDTALK_WECHAT_APPID:}
cardtalk.wechat-merchant-serial=${CARDTALK_WECHAT_MERCHANT_SERIAL:}
cardtalk.wechat-private-key-file=${CARDTALK_WECHAT_PRIVATE_KEY_FILE:}
cardtalk.wechat-public-keys-file=${CARDTALK_WECHAT_PUBLIC_KEYS_FILE:}
cardtalk.wechat-api-v3-key=${CARDTALK_WECHAT_API_V3_KEY:}
cardtalk.wechat-endpoint=${CARDTALK_WECHAT_ENDPOINT:https://api.mch.weixin.qq.com}
cardtalk.wechat-allow-loopback-http=${CARDTALK_WECHAT_ALLOW_LOOPBACK_HTTP:false}
cardtalk.wechat-timeout-seconds=${CARDTALK_WECHAT_TIMEOUT_SECONDS:15}
cardtalk.wechat-max-concurrent=${CARDTALK_WECHAT_MAX_CONCURRENT:4}

# Production report accounting uses PostgreSQL; memory is development-only.
cardtalk.report-quota-mode=${CARDTALK_REPORT_QUOTA_MODE:memory}

# Production anonymous expansion quota uses PostgreSQL; JSON is single-process development only.
cardtalk.trial-repository-mode=${CARDTALK_TRIAL_REPOSITORY_MODE:json}

# Opt-in support workflow; requires PostgreSQL and never automatically collects communication history.
cardtalk.support-enabled=${CARDTALK_SUPPORT_ENABLED:false}
cardtalk.support-daily-limit=${CARDTALK_SUPPORT_DAILY_LIMIT:5}
cardtalk.support-retention-days=${CARDTALK_SUPPORT_RETENTION_DAYS:90}

cardtalk.content-enabled=${CARDTALK_CONTENT_ENABLED:false}
cardtalk.content-operator-account-ids=${CARDTALK_CONTENT_OPERATOR_ACCOUNT_IDS:}

# Process-local fixed-category runtime counters; restricted to configured operator accounts.
cardtalk.metrics-enabled=${CARDTALK_METRICS_ENABLED:false}

# Independent least-privilege operator scopes; no implicit billing authority.
cardtalk.support-operator-account-ids=${CARDTALK_SUPPORT_OPERATOR_ACCOUNT_IDS:}
cardtalk.metrics-operator-account-ids=${CARDTALK_METRICS_OPERATOR_ACCOUNT_IDS:}

# Optional server-owned logical voice catalog; absent preserves the legacy voice.
cardtalk.voice-catalog-file=${CARDTALK_VOICE_CATALOG_FILE:}
